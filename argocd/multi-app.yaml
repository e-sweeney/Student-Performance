apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-testing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/e-sweeney/Student-Performance.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/e-sweeney/Student-Performance.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: production

